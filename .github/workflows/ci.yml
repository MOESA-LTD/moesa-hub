name: ci

on:
    pull_request:
        # `labeled` lets the reset-staging label start a run on its own (see the staging job).
        types: [opened, synchronize, reopened, labeled]
    workflow_dispatch:
        inputs:
            reset_staging:
                description: Wipe staging and rebuild it from migrations and seed (deletes all data on staging)
                type: boolean
                default: false
    push:
        branches:
            - main
            - refactor/**

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    app:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: app

        steps:
            - uses: actions/checkout@v4

            - uses: pnpm/action-setup@v4
              with:
                  version: 10

            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: pnpm
                  cache-dependency-path: app/pnpm-lock.yaml

            - run: pnpm install --frozen-lockfile
            # The build also generates auto-imports.d.ts and .eslintrc-auto-import.json (gitignored),
            # which typecheck and lint need.
            - run: pnpm build
            - run: pnpm lint
            - run: pnpm typecheck
            # Importing the app creates the Supabase client at module load; the tests never reach
            # the network, so placeholder values are enough.
            - run: pnpm test
              env:
                  VITE_SUPABASE_PROJECT_URL: http://127.0.0.1:54321
                  VITE_SUPABASE_PROJECT_ANON_KEY: ci-placeholder
            # The dev story seed's node tests (no database needed).
            - run: pnpm test:scripts

    functions:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: supabase/functions

        steps:
            - uses: actions/checkout@v4

            - uses: denoland/setup-deno@v2
              with:
                  deno-version: v2.x

            - run: deno task check
            - run: deno task test

    database:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: supabase/setup-cli@v1
              with:
                  version: 2.9.6

            # The Edge Functions read supabase/functions/.env (git-ignored) when served by start;
            # invitations and sign-up need SITE_URL, Amazon stays unconfigured (fails closed).
            - run: printf 'SITE_URL=http://localhost:6161\nSIGNUP_TRUSTED_PROXY_HOPS=1\n' > supabase/functions/.env

            # The local image still carries Supabase's legacy default ACL in public (ALL to anon and
            # authenticated); hosted projects created since then do not. Build as on a hosted project, so a
            # migration that depends on those defaults fails here, not on staging (001_default_privileges).
            - run: >-
                  printf '%s\n'
                  'ALTER DEFAULT PRIVILEGES FOR ROLE postgres IN SCHEMA public REVOKE ALL ON TABLES FROM anon, authenticated;'
                  'ALTER DEFAULT PRIVILEGES FOR ROLE postgres IN SCHEMA public REVOKE ALL ON SEQUENCES FROM anon, authenticated;'
                  'ALTER DEFAULT PRIVILEGES FOR ROLE postgres IN SCHEMA public REVOKE ALL ON FUNCTIONS FROM anon, authenticated;'
                  > supabase/migrations/000_hosted_default_acl.sql

            # Migrations and seed.sql run on start. Auth and Storage stay up: the seed writes
            # auth.users/identities and the migrations write storage.buckets. The edge runtime serves
            # the functions the HTTP suite calls (invitation, sign-up, transfer, user).
            - run: supabase start -x studio,imgproxy,logflare,vector
            - run: supabase test db

            # The field-security attack suite over real HTTP (local PostgREST, GoTrue, Storage); the
            # Edge Functions are served by the edge runtime above. Keys stay in env.
            - uses: denoland/setup-deno@v2
              with:
                  deno-version: v2.x
            - name: HTTP attack suite
              run: |
                  eval "$(supabase status -o env | sed 's/^/export /')"
                  cd supabase/functions && deno task test:http

            # The generated masked-field list (app/src/@types/maskedFields.generated.ts) against
            # public.field_class, in the database container (docker exec, as locally).
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
            - run: node --test scripts/masked-fields.test.mjs
              env:
                  MASKED_FIELDS_REQUIRE_DB: '1'

    # Cloudflare Pages previews read the staging project (moesa-panel-staging). After a pull
    # request's database tests pass, or a push to a refactor/** branch (merged pull requests land
    # there), staging gets that branch's new migrations with `db push`, which keeps the data people
    # entered on staging (demo records typed in through the UI). A full rebuild from migrations and
    # seed, which deletes all staging data, runs only on request: the pull request carries the
    # `reset-staging` label, or the workflow is started by hand with reset_staging. Use it when a
    # branch edits an already-applied migration or `db push` fails on diverged migration history.
    # Older previews are not kept working.
    staging:
        if: >-
            github.event_name == 'pull_request' || startsWith(github.ref, 'refs/heads/refactor/')
            || github.event_name == 'workflow_dispatch'
        needs: database
        runs-on: ubuntu-latest
        concurrency:
            group: staging-db
            cancel-in-progress: false
        env:
            SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
            SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_STAGING_DB_PASSWORD }}
            STAGING_PROJECT_REF: tagnpmnmfvfadraubeom
        steps:
            - uses: actions/checkout@v4

            # CLI 3.x: `db reset --linked` works on a hosted project (2.x fails on the auth
            # sequence owner) and the local config needs its mail section under the 3.x name.
            - uses: supabase/setup-cli@v1
              with:
                  version: 3.0.0

            - run: sed -i 's/^\[inbucket\]/[local_smtp]/' supabase/config.toml
            - run: supabase link --project-ref "$STAGING_PROJECT_REF"
            # The app reads and writes through the `api` schema (064 closes `public` to users), so
            # PostgREST on staging must expose it before the reset applies the cutover.
            - name: Expose the api schema on staging
              run: >-
                  curl -fsS -X PATCH -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN"
                  -H 'Content-Type: application/json'
                  "https://api.supabase.com/v1/projects/$STAGING_PROJECT_REF/postgrest"
                  --data '{"db_schema":"public,api"}'
            - name: Apply the migrations to staging
              env:
                  RESET_STAGING: >-
                      ${{ contains(github.event.pull_request.labels.*.name, 'reset-staging')
                      || inputs.reset_staging == true }}
              run: |
                  if [ "$RESET_STAGING" = "true" ]; then
                      echo "::warning::reset-staging requested: all staging data is deleted and rebuilt from seed"
                      supabase db reset --linked --yes
                  elif ! supabase db push --linked --include-all --yes; then
                      echo "::error::db push failed (diverged migration history?). Staging data was kept. Add the reset-staging label to rebuild staging from scratch; that deletes all staging data."
                      exit 1
                  fi

            # The Edge Functions of this branch, so the preview calls the same code it was built with.
            - run: supabase functions deploy --project-ref "$STAGING_PROJECT_REF" --yes

            # Function secrets: the Amazon sandbox app (SP-API) and the URLs the functions link to.
            # APP_URL is the preview's branch alias (Cloudflare: lower case, other characters to '-',
            # at most 28 characters). Values come from repository secrets and are masked in the log.
            - name: Set the staging function secrets
              env:
                  LWA_CLIENT_ID: ${{ secrets.STAGING_AMAZON_SPAPI_LWA_CLIENT_ID }}
                  LWA_CLIENT_SECRET: ${{ secrets.STAGING_AMAZON_SPAPI_LWA_CLIENT_SECRET }}
                  REFRESH_TOKEN: ${{ secrets.STAGING_AMAZON_SPAPI_REFRESH_TOKEN }}
                  STATE_SECRET: ${{ secrets.STAGING_AMAZON_SPAPI_STATE_SECRET }}
              run: |
                  alias=$(printf '%s' "${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}" | tr 'A-Z' 'a-z' | sed 's/[^a-z0-9]/-/g' | cut -c1-28 | sed 's/-*$//')
                  umask 077
                  cat > /tmp/staging-functions.env <<EOF
                  AMAZON_SPAPI_ENV=sandbox
                  AMAZON_SPAPI_REGION=eu
                  AMAZON_SPAPI_LWA_CLIENT_ID=$LWA_CLIENT_ID
                  AMAZON_SPAPI_LWA_CLIENT_SECRET=$LWA_CLIENT_SECRET
                  AMAZON_SPAPI_REFRESH_TOKEN=$REFRESH_TOKEN
                  AMAZON_SPAPI_STATE_SECRET=$STATE_SECRET
                  APP_URL=https://$alias.moesa-panel.pages.dev
                  PUBLIC_SUPABASE_URL=https://$STAGING_PROJECT_REF.supabase.co
                  EOF
                  sed -i 's/^ *//' /tmp/staging-functions.env
                  supabase secrets set --project-ref "$STAGING_PROJECT_REF" --env-file /tmp/staging-functions.env --yes
                  rm -f /tmp/staging-functions.env

            # The reset emptied Vault: the pg_cron jobs (migration 047) read the functions' URL and the
            # service-role key from it. The key is read from the Management API, never printed.
            - name: Set the staging Vault secrets for pg_cron
              run: |
                  api=https://api.supabase.com/v1/projects/$STAGING_PROJECT_REF
                  key=$(curl -fsS -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" "$api/api-keys?reveal=true" \
                      | jq -r '.[] | select(.name == "service_role") | .api_key')
                  test -n "$key" || { echo "no service_role key"; exit 1; }
                  echo "::add-mask::$key"
                  url="https://$STAGING_PROJECT_REF.supabase.co/functions/v1"
                  # Dollar quoting: neither value contains $v$.
                  query="DELETE FROM vault.secrets WHERE name IN ('edge_function_url', 'edge_service_key');
                  SELECT vault.create_secret(\$v\$$url\$v\$, 'edge_function_url', 'Edge Functions base URL for pg_cron');
                  SELECT vault.create_secret(\$v\$$key\$v\$, 'edge_service_key', 'Service key for pg_cron calls');"
                  jq -n --arg q "$query" '{query: $q}' > /tmp/vault.json
                  curl -fsS -o /dev/null -X POST -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
                      -H 'Content-Type: application/json' "$api/database/query" --data @/tmp/vault.json
                  rm -f /tmp/vault.json
